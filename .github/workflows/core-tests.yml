name: core-tests

# Dependency-free check: the pure-Python core of GeminiLens (cost, drift,
# store, observer, Azure adapter) must import and pass its tests using only the
# standard library, with no third-party packages installed. This guards the
# property that you can drop the core into a minimal environment without
# pulling in httpx / google-genai / streamlit just to account for cost.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stdlib-unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all sources
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run standard-library unit tests (no third-party deps)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/unit -v
