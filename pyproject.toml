[project]
name = "geminilens"
version = "0.2.0"
description = "Drop-in observability for Gemini agents: traces, cost, drift, egress allowlist. Ships exporters for Arize Phoenix, Splunk HEC, Elastic, GitLab Observability, MongoDB Atlas, Dynatrace, TrueFoundry."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Mukunda Katta" }]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "google-cloud-aiplatform>=1.71.0",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
exporters = [
    "arize-phoenix-otel>=0.6.0",
    "opentelemetry-sdk>=1.27.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/geminilens"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
